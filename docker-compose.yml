services:
  innergate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/its-the-vibe/innergate:latest
    pull_policy: always
    read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"    
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./config.json:/config.json:ro
    environment:
      - CONFIG_PATH=/config.json
      - PORT=8080
    restart: on-failure:10
